# Required check on main once enabled (task T014). Runner images and every
# action are pinned so a green build stays reproducible (research R1, R12).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Generate code
        working-directory: app
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Core purity check
        run: dart tool/check_core_purity.dart

      - name: No-network check
        run: dart tool/check_no_network.dart

      - name: Core tests
        working-directory: packages/trn_core
        run: dart test

      - name: App tests (golden tests run here, on Linux only)
        working-directory: app
        run: flutter test

      - name: Debug Android build
        working-directory: app
        run: flutter build apk --debug
